name: Feature request
description: Propose a concrete feature or requirement
title: "[Feature]: "
labels: ["feature", "needs-triage"]
body:
  - type: textarea
    id: background
    attributes:
      label: Background
      description: Why is this feature needed?
    validations:
      required: true
  - type: textarea
    id: user_story
    attributes:
      label: User story
      description: As a user, I want to..., so that...
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included?
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What is explicitly excluded?
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Use checkboxes.
      value: |
        - [ ] 
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: technical_notes
    attributes:
      label: Technical notes
      description: Related modules, files, APIs, risks.
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true
