name: Feature request
description: Propose a ContextGraph feature or agent workflow improvement
title: "[Feature]: "
labels: ["feature", "needs-triage"]
body:
  - type: textarea
    id: background
    attributes:
      label: Background
      description: Why is this feature needed?
    validations:
      required: true
  - type: textarea
    id: user_story
    attributes:
      label: User story
      description: As a user, I want to..., so that...
    validations:
      required: true
  - type: textarea
    id: agent_workflow
    attributes:
      label: Agent workflow
      description: Where does this fit into init, index, status, brief, query, handoff, MCP, or another agent workflow?
    validations:
      required: true
  - type: textarea
    id: why_current_tools_not_enough
    attributes:
      label: Why README / AGENTS / grep is not enough
      description: Explain the project experience gap this should solve.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included?
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What is explicitly excluded?
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Use checkboxes.
      value: |
        - [ ] 
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: technical_notes
    attributes:
      label: Technical notes
      description: Related modules, files, APIs, risks.
    validations:
      required: false
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected query / brief / MCP behavior
      description: Include example queries or MCP responses if useful.
    validations:
      required: false
  - type: textarea
    id: security
    attributes:
      label: Local-first or security concerns
      description: Note any data upload, provider, secret redaction, or sensitive project content concerns.
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true
