name: Bug report
description: Report a reproducible ContextGraph defect
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: input
    id: contextgraph_version
    attributes:
      label: ContextGraph version
      placeholder: "@stardreamg/contextgraph@0.1.2"
    validations:
      required: true
  - type: input
    id: node_version
    attributes:
      label: Node.js version
      placeholder: "node -v"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 15, Ubuntu 24.04, Windows 11, etc."
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options:
        - CLI
        - MCP
        - both
    validations:
      required: true
  - type: dropdown
    id: initialized
    attributes:
      label: Is the project initialized with ContextGraph?
      options:
        - "yes"
        - "no"
        - "not sure"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or MCP tool call
      render: shell
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: status_output
    attributes:
      label: Sanitized status output
      description: Paste `contextgraph status` output after removing sensitive paths or data.
      render: text
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal sanitized reproduction
      description: Do not include real tokens, private keys, production IPs, customer data, or proprietary content.
    validations:
      required: false
